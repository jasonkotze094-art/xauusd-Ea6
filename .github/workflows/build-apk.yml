name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "::error::Java version $JAVA_VER is lower than 17."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create debug.keystore."
            exit 1
          fi
          echo "debug.keystore confirmed present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET" ]; then
            echo "::error::Expected APK file $TARGET was not found!"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$TARGET" ]; then
            echo "::error::APK file $TARGET is empty!"
            exit 1
          fi
          case "$TARGET" in
            *.apk) ;;
            *) echo "::error::$TARGET does not have .apk extension"; exit 1 ;;
          esac
          if [ "$TARGET" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::APK path mismatch."
            exit 1
          fi
          echo "Verified $TARGET successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          ASSET_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$ASSET_DIR"
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is missing or empty."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset at ${ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: release_step
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset $ASSET_PATH is invalid."
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          
          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          
          Note: This APK is intended for testing and is signed only with a temporary debug keystore. It is not a Play Store production release.
          EOF
          )
          
          gh release create "$TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.release_step.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG"
            
            RELEASE_URL=$(gh release view "$TAG" --json url -q ".url")
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Successful"
              echo ""
              echo "The debug APK has been successfully built and published to GitHub Releases!"
              echo ""
              echo "- **Release Title**: $TITLE"
              echo "- **Release Tag**: \`$TAG\`"
              echo "- **APK Asset Filename**: \`$ASSET_NAME\`"
              echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "### Download Options:"
              echo "1. **Direct GitHub Release**: You can download \`$ASSET_NAME\` directly from the release Assets section at [$RELEASE_URL]($RELEASE_URL) onto your phone."
              echo "2. **Backup Artifact**: The normal GitHub Actions artifact named \`app-debug-apk\` is also stored and available in this workflow run summary."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The APK build succeeded, and the artifact 'app-debug-apk' remains available."
            
            {
              echo "## ⚠️ Debug APK Built (Release Publishing Failed)"
              echo ""
              echo "The debug APK was built successfully, but publishing to GitHub Releases encountered an issue or was bypassed."
              echo ""
              echo "### Download Instructions:"
              echo "- **GitHub Actions Artifact**: The debug APK artifact named \`app-debug-apk\` was successfully uploaded and is available for download directly from the summary section of this workflow run."
            } >> $GITHUB_STEP_SUMMARY
          fi
